name: iOS release
on:
  push:
  workflow_dispatch:
    inputs:
      tag:
        description: Optional new prerelease tag
        required: false
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - name: Resolve new engine dependencies
        run: cargo generate-lockfile
      - name: Test services and packaging
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          cargo test --workspace --locked 2>&1 | tee build/rust-tests.log
          python3 -m unittest discover -s tools -p 'test_*.py' -v 2>&1 | tee build/build-tests.log
      - name: Build ARM64 Rust library
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p launcher --release --locked --target aarch64-apple-ios 2>&1 | tee build/rust-build.log
      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          brew list xcodegen || brew install xcodegen
          xcodegen generate --spec ios/project.yml 2>&1 | tee build/project.log
      - name: Compile iPhone app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project ios/IW4Pocket.xcodeproj -scheme IW4Pocket -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/derived ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build/xcodebuild.log
      - name: Package and verify unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/package/Payload
          cp -R build/derived/Build/Products/Release-iphoneos/IW4Pocket.app build/package/Payload/
          cd build/package
          ditto -c -k --keepParent Payload ../IW4Pocket-unsigned.ipa
          cd ../..
          python3 tools/verify_ipa.py build/IW4Pocket-unsigned.ipa 2>&1 | tee build/ipa-check.log
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: IW4Pocket-unsigned
          path: build/IW4Pocket-unsigned.ipa
          if-no-files-found: error
      - name: Build Rust engine and collect licenses
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        run: |
          set -euo pipefail
          cargo build -p range --release --locked --target aarch64-apple-ios 2>&1 | tee build/range-build.log
          python3 tools/range_licenses.py 2>&1 | tee build/range-licenses.log
          python3 tools/package_range.py aarch64-apple-ios build/range/Payload
          cd build/range
          ditto -c -k --keepParent Payload ../PocketRange-unsigned.ipa
          cd ../..
          python3 tools/verify_ipa.py build/PocketRange-unsigned.ipa 2>&1 | tee build/range-ipa.log
      - name: Test Rust engine in iPhone simulator
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        run: |
          set -euo pipefail
          if [ "$(uname -m)" = arm64 ]; then SIM=aarch64-apple-ios-sim; else SIM=x86_64-apple-ios; fi
          cargo build -p range -p launcher --release --locked --target "$SIM" 2>&1 | tee build/range-sim-build.log
          python3 tools/package_range.py "$SIM" build/simulator
          SIMID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for ds in json.load(sys.stdin)["devices"].values() for d in ds if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$SIMID"
          xcrun simctl bootstatus "$SIMID" -b
          xcrun simctl install "$SIMID" build/simulator/PocketRange.app
          xcodebuild -project ios/IW4Pocket.xcodeproj -scheme IW4Pocket -configuration Release -destination "platform=iOS Simulator,id=$SIMID" -derivedDataPath build/sim-derived -resultBundlePath build/range-smoke.xcresult LIBRARY_SEARCH_PATHS="$(pwd)/target/$SIM/release" CODE_SIGNING_ALLOWED=NO test 2>&1 | tee build/range-smoke.log
          DATA=$(xcrun simctl get_app_container "$SIMID" com.iw4pocket.range data)
          cp "$DATA/Documents/range-status.json" build/range-status.json
          python3 -c 'import json; d=json.load(open("build/range-status.json")); assert d["mode"] == 2 and d["shots"] >= 1, d; print(d)'
          xcrun simctl launch "$SIMID" com.iw4pocket.range
          xcrun simctl io "$SIMID" screenshot build/range-simulator.png
      - name: Upload Rust range IPA
        uses: actions/upload-artifact@v4
        with:
          name: PocketRange-unsigned
          path: build/PocketRange-unsigned.ipa
          if-no-files-found: error
      - name: Upload engine runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: range-runtime-evidence
          path: |
            build/range-smoke.xcresult
            build/range-simulator.png
            build/range-status.json
            build/range-licenses.txt
      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-evidence
          path: |
            build/*.log
            Cargo.lock
            ios/Info.plist
            ios/IW4Pocket.xcodeproj/project.pbxproj
          if-no-files-found: warn
  release:
    if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: IW4Pocket-unsigned
          path: build
      - name: Publish optional prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git check-ref-format "refs/tags/$TAG"
          gh release create "$TAG" build/IW4Pocket-unsigned.ipa --target "$GITHUB_SHA" --prerelease --title "IW4 Pocket $TAG" --notes "Launcher with a link to the separately packaged Macroquad practice range. Unsigned IPA requires signing. No MW2 compatibility."
