[workspace]
members = ["crates/launcher", "crates/validation", "crates/diag", "engine/range"]
resolver = "2"
exclude = ["engine/vendor/miniquad"]

[patch.crates-io]
miniquad = { path = "engine/vendor/miniquad" }

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
