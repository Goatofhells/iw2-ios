name: IW4Pocket
options:
  deploymentTarget:
    iOS: "15.0"
targets:
  rangeui:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: rangeui
    dependencies:
      - target: IW4Pocket
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iw4pocket.rangeui
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: IW4Pocket
        SWIFT_VERSION: "5.0"
  IW4Pocket:
    type: application
    platform: iOS
    sources:
      - path: pocket.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iw4pocket.launcher
        PRODUCT_NAME: IW4Pocket
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OBJC_BRIDGING_HEADER: bridge.h
        LIBRARY_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/../target/aarch64-apple-ios/release"
        OTHER_LDFLAGS: "$(inherited) -llauncher -lc++ -liconv -framework Security -framework SystemConfiguration"
        CODE_SIGNING_ALLOWED: "NO"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: IW4 Pocket
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIFileSharingEnabled: false
        LSSupportsOpeningDocumentsInPlace: false
        ITSAppUsesNonExemptEncryption: false
        LSApplicationQueriesSchemes:
          - pocketrange
schemes:
  IW4Pocket:
    build:
      targets:
        IW4Pocket: all
        rangeui: [test]
    test:
      targets:
        - rangeui
